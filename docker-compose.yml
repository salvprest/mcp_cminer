services:
  mcp-cminer:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass the token from your host environment into the build
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    container_name: mcp-cminer

    ports:
      - "8222:8222"

    # Persist uploads, sessions and datasets on the host
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets:ro   # read-only: datasets are input data

    # Load environment variables (API keys, auth tokens, etc.)
    env_file:
      - .env

    environment:
      - PLANTUML_SERVER_URL=http://plantuml:8080

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - external_net

    dns:
      - 8.8.8.8
      - 8.8.4.4

    depends_on:
      - plantuml

    restart: on-failure

  plantuml:
    image: plantuml/plantuml-server:jetty
    environment:
      - JAVA_OPTS=-Xmx1g
      - PLANTUML_LIMIT_SIZE=8192
    networks:
      - external_net
    restart: on-failure

networks:
  external_net:
    external: true
    name: shared_cminer-network
