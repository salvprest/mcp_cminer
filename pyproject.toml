[project]
name = "mcp-cminer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "cminer",
    "cml2graph",
    "fastapi>=0.135.0",
    "fastmcp>=3.0.0",
    "fastmcp[tasks]>=3.1.0",
    "python-multipart>=0.0.22",
    "rich>=14.2.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
main = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv.sources]
cminer = { git = "https://github.com/SimoneAvellino/CMiner.git", branch = "cminer-ai" }
cml2graph = { git = "https://github.com/salvprest/cml2graph.git" }
